<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Do List Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <h1>Dashboard</h1>
    <button data-action="toggle-theme" aria-label="Toggle theme">Toggle Theme</button>
  </header>

  <main>

    <section id="greeting" aria-label="Greeting">
      <!-- Greeting module renders here: time, date, salutation, name input -->
    </section>

    <section id="timer" aria-label="Pomodoro Timer">
      <!-- Timer module renders here: countdown display, Start/Stop/Reset controls, duration input -->
    </section>

    <section id="task-list" aria-label="Task List">
      <!-- Task module renders here: add-task form, task rows -->
    </section>

    <section id="quick-links" aria-label="Quick Links">
      <!-- Links module renders here: add-link form, link buttons -->
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
